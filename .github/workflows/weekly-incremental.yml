name: PolitData weekly incremental update

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"
      timezone: "Europe/Kyiv"

permissions:
  contents: write

concurrency:
  group: politdata-release-writer
  cancel-in-progress: false

jobs:
  update:
    name: Restore, update, validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GENERATION_ID: weekly-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Restore latest, run bounded incremental and publish if changed
        run: >-
          python scripts/run_scheduled_incremental.py
          --repository "$GITHUB_REPOSITORY"
          --work-root "$RUNNER_TEMP/politdata-generation"
          --generation-id "$GENERATION_ID"
          --code-revision "$GITHUB_SHA"
          --organization-limit 250
          --report-discovery-limit 500
          --report-detail-limit 1000

      - name: Write schedule summary
        if: ${{ always() }}
        run: |
          echo "## PolitData weekly incremental" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: Monday 03:37 Europe/Kyiv" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing latest generation is retained on any failure" >> "$GITHUB_STEP_SUMMARY"
          echo "- A new release is published only when source changes are detected" >> "$GITHUB_STEP_SUMMARY"
